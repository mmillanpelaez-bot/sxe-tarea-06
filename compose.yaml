services:
  database:
    image: mariadb:10.11
    container_name: lagares_db
    restart: always
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: kimai/kimai2:apache-2.32.0
    container_name: lagares_app
    restart: always
    ports:
      - "8090:8001"
    environment:
      APP_ENV: prod
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@database:3306/${DB_NAME}?charset=utf8mb4&serverVersion=10.11.0-MariaDB
      TRUSTED_HOSTS: localhost,127.0.0.1,lagares_app
      APP_SECRET: ${APP_SECRET}
    depends_on:
      database:
        condition: service_healthy

  dbmanager:
    image: adminer:4.8.1
    container_name: lagares_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - database

volumes:
  db_data:
